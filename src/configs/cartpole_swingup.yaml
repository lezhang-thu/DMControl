# environment
domain_name: cartpole
task_name: swingup
pre_transform_image_size: 100
image_size: 84
action_repeat: 8
frame_stack: 3
# replay buffer
replay_buffer_capacity: 100000
# train
init_steps: 1000
num_env_steps: 105000 # 500100
batch_size: 512
hidden_dim: 1024
# eval
eval_freq: 5000
num_eval_episodes: 10
# critic
critic_lr: 1e-3
critic_beta: 0.9
critic_tau: 0.01
critic_target_update_freq: 2
# actor
actor_lr: 1e-3
actor_beta: 0.9
actor_log_std_min: -10
actor_log_std_max: 2
actor_update_freq: 2
# encoder
encoder_feature_dim: 50
encoder_lr: 1e-3
encoder_tau: 0.05
num_layers: 4
num_filters: 64
# sac
discount: 0.99
init_temperature: 0.1
alpha_lr: 1e-4
alpha_beta: 0.5
# spr
jumps: 6
transition_model_layer_width: 512
latent_dim: 100
auxiliary_task_batch_size: 128
momentum_tau: 0.05
fp_loss_weight: 1.0
auxiliary_task_lr: 1e-3
# misc
seed: -1
gpuid: 0
work_dir: ???
# log
log_interval: 100
# Keep run outputs isolated, as in the original Hydra configuration.
hydra:
  job:
    chdir: true
